# CI quality gate: runs the test suite on push/PR to main.
# Sets up Python 3.11, installs deps, then runs pip check (dependency
# compatibility), ruff (lint), and pytest with a >=80% coverage floor.
name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Check installed dependencies
        run: pip check

      - name: Run Ruff
        run: ruff check --output-format=github webapp tests

      - name: Run tests
        run: pytest tests/ --color=yes --cov=webapp --cov-report=term-missing --cov-fail-under=80
